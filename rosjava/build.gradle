plugins {
    id 'java-library'
}

dependencies {
  implementation project(':apache_xmlrpc_common')
  implementation project(':apache_xmlrpc_server')
  implementation project(':apache_xmlrpc_client')
  
  implementation 'dnsjava:dnsjava:2.1.1'
  api 'org.apache.commons:com.springsource.org.apache.commons.logging:1.1.1'
  api 'org.apache.commons:com.springsource.org.apache.commons.net:2.0.0'
  api 'com.google.guava:guava:12.0'

  implementation 'org.ros.rosjava_messages:std_msgs:[0.1,0.6)'
  implementation 'org.ros.rosjava_messages:rosgraph_msgs:[1.11,1.12)'
  implementation 'org.ros.rosjava_messages:geometry_msgs:[1.11,1.14)'

  testImplementation 'junit:junit:4.8.2'
  testImplementation 'org.mockito:mockito-all:1.8.5'
  testImplementation 'org.ros.rosjava_messages:rosjava_test_msgs:[0.3,0.5)'
  testImplementation 'org.ros.rosjava_messages:nav_msgs:[1.12,1.20)'

  api 'org.ros.rosjava_bootstrap:message_generation:[0.3,0.4)'
}

jar {
  manifest {
    version = project.version
    attributes(
      "symbolicName": 'org.ros.rosjava'
    )
    //instruction 'Export-Package', '!org.ros.internal.*, org.ros.*'
    //instruction 'Private-Package', 'org.ros.internal.*'
  }
}

